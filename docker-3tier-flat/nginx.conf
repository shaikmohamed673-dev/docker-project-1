server {
    listen 80;

    # Serve the website
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Forward API calls to the backend container (Docker DNS name "backend")
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
