services:

  # ===== Tier 3: Database =====
  db:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data                     # persistent data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # runs once on first start
    networks: [backend-net]                                  # NOT reachable from frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== Tier 2: Backend API =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy                           # wait until DB is ready
    networks: [frontend-net, backend-net]                    # bridge between tiers

  # ===== Tier 1: Frontend (website) =====
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: app-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"                               # only public entry point
    depends_on:
      - backend
    networks: [frontend-net]

networks:
  frontend-net:
  backend-net:

volumes:
  db_data:
